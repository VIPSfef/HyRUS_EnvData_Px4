module_name: shtc3
parameters:
- group: Sensors
  definitions:
    SENS_EN_SHTC3:
      description:
        short: SHTC3 temperature and hygrometer
        long: Enables SHTC3 startup through the HyRUS SD-card etc/extras.txt addon. The addon selects the external I2C bus; the sensor address is 0x70.
      type: boolean
      default: 0
      reboot_required: true
