name: HyRUS firmware compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hyrus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ${{ matrix.profile }} - Native tests and Pixhawk 6C firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [main, r2026b]
    env:
      HYRUS_PROFILE: ${{ matrix.profile }}
      HYRUS_PX4_DIR: build/ci-${{ matrix.profile }}/px4
      HYRUS_RESULTS_DIR: build/ci-${{ matrix.profile }}/results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare the pinned PX4 fork and submodules
        run: |
          mkdir -p "$HYRUS_RESULTS_DIR"
          python3 Tools/hyrus/firmware.py prepare --profile "$HYRUS_PROFILE" --px4-dir "$HYRUS_PX4_DIR" 2>&1 | tee "$HYRUS_RESULTS_DIR/prepare.log"
      - name: Install official PX4 build dependencies
        run: |
          if [[ "$HYRUS_PROFILE" == r2026b ]]; then
            export PIP_CONSTRAINT="$GITHUB_WORKSPACE/Tools/hyrus/profiles/r2026b-python.txt"
          fi
          bash "$HYRUS_PX4_DIR/Tools/setup/ubuntu.sh" --no-sim-tools
      - name: Check native protocols and build complete ARM firmware
        run: python3 Tools/hyrus/validate.py --profile "$HYRUS_PROFILE" --px4-dir "$HYRUS_PX4_DIR" --output "$HYRUS_RESULTS_DIR" --jobs 2
      - name: Keep validation results, logs and firmware
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyrus-firmware-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.HYRUS_RESULTS_DIR }}/
          if-no-files-found: warn
          retention-days: 14
