name: HyRUS firmware compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hyrus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Native tests and Pixhawk 6C firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare the pinned PX4 fork and submodules
        run: |
          mkdir -p build/hyrus-ci
          python3 Tools/hyrus/firmware.py prepare 2>&1 | tee build/hyrus-ci/prepare.log
      - name: Install official PX4 build dependencies
        run: bash build/px4/Tools/setup/ubuntu.sh --no-sim-tools
      - name: Check native protocols and build complete ARM firmware
        run: python3 Tools/hyrus/validate.py --output build/hyrus-ci --jobs 2
      - name: Keep validation results, logs and firmware
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyrus-firmware-${{ github.sha }}-${{ github.run_attempt }}
          path: build/hyrus-ci/
          if-no-files-found: warn
          retention-days: 14
