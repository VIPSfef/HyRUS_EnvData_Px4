name: HyRUS upstream main candidate

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hyrus-upstream-main
  cancel-in-progress: false

jobs:
  candidate:
    name: Merge official main into the pinned fork and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare a detached fork merge and module manifest candidate
        id: prepare
        run: |
          mkdir -p build/hyrus-upstream
          python3 Tools/hyrus/upstream.py prepare --output build/hyrus-upstream 2>&1 | tee build/hyrus-upstream/merge.log
      - name: Prepare the candidate fork and its pinned submodules
        if: steps.prepare.outputs.changed == 'true'
        run: python3 Tools/hyrus/firmware.py prepare 2>&1 | tee build/hyrus-upstream/prepare.log
      - name: Install candidate PX4 build dependencies
        if: steps.prepare.outputs.changed == 'true'
        run: bash build/px4/Tools/setup/ubuntu.sh --no-sim-tools
      - name: Test and build the exact fork and module candidate
        if: steps.prepare.outputs.changed == 'true'
        run: python3 Tools/hyrus/validate.py --output build/hyrus-upstream --jobs 2
      - name: Package the two tested Git candidates for review
        if: steps.prepare.outputs.changed == 'true'
        run: python3 Tools/hyrus/upstream.py package --output build/hyrus-upstream
      - name: Keep merge report, validation logs, firmware and Git bundles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyrus-upstream-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/hyrus-upstream/
          if-no-files-found: warn
          retention-days: 14
